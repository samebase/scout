name: Alchemy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

# Deploy and destroy share a queue because the team state store has no lock.
concurrency:
  group: alchemy-${{ github.event.pull_request.number || github.ref_name }}
  queue: max
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
  PULL_REQUEST: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'pull_request' && 'the preview' || 'production' }}
    if: >-
      github.event.action != 'closed' && (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository || github.event_name !=
      'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 26.x, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the current branch head
        run: node ./scripts/verify-deployment-head.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy the stack
        id: deploy
        run: pnpm exec alchemy deploy --stage ${{ env.STAGE }} --yes --no-input
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fe57d01d7ab41f60d00ba1aade20eb33
          CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          GITHUB_TOKEN: ${{ github.event_name == 'pull_request' && github.token || '' }}

  destroy:
    name: Destroy the preview
    if: >-
      github.event.action == 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 26.x, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Destroy the stack
        run: pnpm exec alchemy destroy --stage ${{ env.STAGE }} --yes --no-input
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
