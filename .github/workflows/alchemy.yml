name: Alchemy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

# Deploy and destroy share a queue because the team state store has no lock.
concurrency:
  group: alchemy-${{ github.event.pull_request.number || github.ref_name }}
  queue: max
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
  PULL_REQUEST: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'pull_request' && 'the preview' || 'production' }}
    if: >-
      github.event.action != 'closed' && (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository || github.event_name !=
      'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # The stack registers every deployment with the identity hub. Without both values it touches
      # nothing.
      - name: Check the identity hub settings
        env:
          HUB_ISSUER: ${{ vars.HUB_ISSUER }}
          HUB_REGISTRATION_TOKEN: ${{ secrets.HUB_REGISTRATION_TOKEN }}
        run: |
          missing=0
          if [ -z "$HUB_ISSUER" ]; then
            echo "::error::Set the repository variable HUB_ISSUER to the identity hub, https://auth.samebase.com. Nothing was deployed."
            missing=1
          fi
          if [ -z "$HUB_REGISTRATION_TOKEN" ]; then
            echo "::error::Set the repository secret HUB_REGISTRATION_TOKEN to the hub's registration token for the app TrailScout. Nothing was deployed."
            missing=1
          fi
          exit "$missing"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.x, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the current branch head
        run: node ./scripts/verify-deployment-head.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy the stack
        id: deploy
        run: pnpm exec alchemy deploy --stage ${{ env.STAGE }} --yes --no-input
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fe57d01d7ab41f60d00ba1aade20eb33
          CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          GITHUB_TOKEN: ${{ github.event_name == 'pull_request' && github.token || '' }}
          HUB_ISSUER: ${{ vars.HUB_ISSUER }}
          HUB_REGISTRATION_TOKEN: ${{ secrets.HUB_REGISTRATION_TOKEN }}

  destroy:
    name: Destroy the preview
    if: >-
      github.event.action == 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The stack reads both values on a destroy too, and the destroy deletes the preview's hub
      # client with the token in its state. Without them it touches nothing.
      - name: Check the identity hub settings
        env:
          HUB_ISSUER: ${{ vars.HUB_ISSUER }}
          HUB_REGISTRATION_TOKEN: ${{ secrets.HUB_REGISTRATION_TOKEN }}
        run: |
          missing=0
          if [ -z "$HUB_ISSUER" ]; then
            echo "::error::Set the repository variable HUB_ISSUER to the identity hub, https://auth.samebase.com. Nothing was destroyed."
            missing=1
          fi
          if [ -z "$HUB_REGISTRATION_TOKEN" ]; then
            echo "::error::Set the repository secret HUB_REGISTRATION_TOKEN to the hub's registration token for the app TrailScout. Nothing was destroyed."
            missing=1
          fi
          exit "$missing"
      # Use the base branch so a broken dependency change in a PR cannot prevent its cleanup.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.x, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Destroy the stack
        run: pnpm exec alchemy destroy --stage ${{ env.STAGE }} --yes --no-input
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HUB_ISSUER: ${{ vars.HUB_ISSUER }}
          HUB_REGISTRATION_TOKEN: ${{ secrets.HUB_REGISTRATION_TOKEN }}
