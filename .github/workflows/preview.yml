name: Preview

on:
  pull_request: { types: [opened, synchronize, reopened, closed] }
jobs:
  preview:
    permissions: { contents: read, pull-requests: write }
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    environment: { name: preview, url: "${{ steps.deploy.outputs.url }}" }
    concurrency: { group: "preview-${{ github.head_ref }}", queue: max }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.x, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: deploy
        uses: samebase/convex-hosting/actions/preview@v1
        with:
          { deploy-key: "${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}", working-directory: apps/scout }
      # The development password account, and SITE_URL for the handoff links and the Polar
      # checkout return URL.
      - working-directory: apps/scout
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PREVIEW: ${{ steps.deploy.outputs.preview-name }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          pnpm exec convex run devAuth:seedPasswordAccount --preview-name "$PREVIEW"
          pnpm exec convex env set SITE_URL "$URL" --preview-name "$PREVIEW"
  cleanup:
    permissions: { contents: read, pull-requests: write }
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    concurrency: { group: "preview-${{ github.head_ref }}", queue: max }
    steps:
      - uses: samebase/convex-hosting/actions/cleanup@v1
        with:
          { deploy-key: "${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}", working-directory: apps/scout }
