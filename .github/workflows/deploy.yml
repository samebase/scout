# Deploys TrailScout through samebase/convex-hosting's deploy action, which runs `pnpm run deploy`
# in apps/scout: a push to main deploys production, a pull request deploys the preview
# pr-<number>, and its close deletes that preview. CI runs the checks.
name: Deploy

on:
  push: { branches: [main] }
  pull_request: { branches: [main], types: [opened, synchronize, reopened, closed] }
permissions: { contents: read, pull-requests: read }
jobs:
  deploy:
    # A pull request from a fork gets no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository || !github.head_ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: "deploy-${{ github.event.number || 'production' }}", queue: max }
    environment:
      name: ${{ github.head_ref && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 11.1.1 }
      # A closed pull request only deletes its preview. Without an install, the pnpm cache step
      # would fail to save a store that does not exist.
      - if: github.event.action != 'closed'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.x, cache: pnpm }
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - id: deploy
        uses: samebase/convex-hosting/actions/deploy@6fb27501a0317547ef914cc78fd682020050aff4
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          preview-deploy-key: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          working-directory: apps/scout
      # A preview gets the development password account, and SITE_URL for the handoff links and
      # the Polar checkout return URL.
      - name: Seed the preview's password account and set its SITE_URL
        if: github.head_ref && steps.deploy.outputs.url
        working-directory: apps/scout
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PREVIEW: pr-${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          pnpm exec convex run devAuth:seedPasswordAccount --preview-name "$PREVIEW"
          pnpm exec convex env set SITE_URL "$URL" --preview-name "$PREVIEW"
