packages:
  - "apps/*"
  - "packages/*"

auditConfig:
  ignoreGhsas:
    # Rechecked 2026-10-22. No patched sprintf-js release exists.
    # Its only caller is just-bash, which catches printf precision RangeErrors
    # and returns exit code 1. workspaceShell.test.ts covers f, e, and g formats.
    - GHSA-hp3w-g68c-fv3c
    # Rechecked 2026-10-27. Zod 3 has no patched release. Its only copy here is firecrawl's
    # (zod 3.25.76, still required by firecrawl 4.51.0), which uses it only to turn schemas into JSON
    # Schema (zodToJsonSchema), never to validate incoming data. Scout's own Zod is 4.6.7.
    - GHSA-mrhx-c7xc-m3w5

allowBuilds:
  "@mongodb-js/zstd": false
  core-js: false
  esbuild: true
  msw: true
  node-liblzma: false
  workerd: false
overrides:
  # guarded-fetch pins an older Undici release with patched request-validation flaws.
  "guarded-fetch>undici": 8.12.4
  # convex-helpers resolves hono 4.13.13; 4.13.16 fixes GHSA-4m76-xfj5-7975, GHSA-h7mg-cq63-vhpq
  # and the other advisories that `pnpm audit --prod` reports. Remove when convex-helpers resolves
  # 4.13.16 or later.
  hono: 4.13.19
  vite@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  # Our own releases, which this repository may install as soon as they are published.
  - "@samebase/*"
patchedDependencies:
  # Adds deleteUser to the Convex Auth 2 core and password components, which account deletion
  # calls, and lets the Resend test stub type-check under exactOptionalPropertyTypes. Remove when
  # upstream ships deletion by user id and that type.
  "@convex-dev/auth@2.0.0-beta.0": patches/@convex-dev__auth@2.0.0-beta.0.patch
