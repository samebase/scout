packages:
  - "apps/*"
  - "packages/*"

patchedDependencies:
  "@convex-dev/static-hosting@0.2.1": patches/@convex-dev__static-hosting@0.2.1.patch

allowBuilds:
  "@mongodb-js/zstd": false
  core-js: false
  esbuild: true
  msw: true
  node-liblzma: false
  sharp: false
  workerd: true
overrides:
  "@hono/node-server": 2.0.10
  hono: "^4.13.5"
  js-yaml: "^4.3.2"
  nanoid: 3.3.18
  postcss: "^8.5.23"
  undici: 7.29.0
  vite: "catalog:"
  vitest: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vitest: 4.1.10
  vite-plus: 0.2.7
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
